version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: claims-intake-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-claims_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-claims_password}
      POSTGRES_DB: ${POSTGRES_DB:-claims_intake}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./packages/backend/migrations:/docker-entrypoint-initdb.d
    networks:
      - claims-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-claims_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: ./packages/backend/Dockerfile
    container_name: claims-intake-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-claims_user}:${POSTGRES_PASSWORD:-claims_password}@postgres:5432/${POSTGRES_DB:-claims_intake}
      PORT: 3001
      SCRAPER_CRON: ${SCRAPER_CRON:-0 0 * * *}
      TWOCAPTCHA_API_KEY: ${TWOCAPTCHA_API_KEY:-}
    ports:
      - "3001:3001"
    volumes:
      - ./packages/backend:/app/packages/backend
      - /app/packages/backend/node_modules
      - /app/packages/backend/dist
    networks:
      - claims-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: ./packages/frontend/Dockerfile
    container_name: claims-intake-frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - .env
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001/api}
    ports:
      - "3000:3000"
    # Commented out for production - uncomment for development hot-reload:
    volumes:
      - ./packages/frontend:/app/packages/frontend
      - /app/packages/frontend/node_modules
    networks:
      - claims-network

networks:
  claims-network:
    driver: bridge

volumes:
  postgres-data:
